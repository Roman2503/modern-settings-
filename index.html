<!DOCTYPE html>
<html lang="ru" style="width: 100vw; height: 100vh;">
<head>
<meta charset="UTF-8">
<title>Настройки игры</title>
<style>
  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
  }
  input[type="text"] { -webkit-user-select: text; user-select: text; }

  html, body {
    width: 100%;
    height: 100%;
    background: rgba(6, 9, 14, 0.74);
    color: #f0f6fc;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    overflow: hidden;
    position: relative;
    display: block;
  }

  .modal-window {
    position: absolute;
    top: 0;
    left: 0;
    -webkit-transform-origin: 0 0;
    transform-origin: 0 0;
    width: 1140px;
    height: 710px;
    background: #0d1117;
    border: 1px solid #283242;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    overflow: hidden;
    display: block;
  }

  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 1140px;
    height: 66px;
    background: #121721;
    border-bottom: 1px solid #222b3a;
    padding: 0 20px;
    display: block;
  }

  .sidebar {
    position: absolute;
    top: 66px;
    left: 0;
    width: 245px;
    height: 582px;
    background: #11161f;
    border-right: 1px solid #222b3a;
    padding: 14px 12px;
    overflow: hidden;
    display: block;
  }

  .content {
    position: absolute;
    top: 66px;
    left: 245px;
    width: 895px;
    height: 582px;
    padding: 18px 26px 18px 24px;
    overflow: hidden;
    display: block;
  }

  .scroll-body {
    display: block;
    width: 100%;
    -webkit-transform: translateY(0px);
    transform: translateY(0px);
  }

  /* Кастомный скроллбар для надёжной прокрутки в Gameface */
  .scroll-track {
    position: absolute;
    top: 10px;
    right: 6px;
    width: 7px;
    height: 562px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 4px;
    cursor: pointer;
    z-index: 25;
    display: none;
  }
  .scroll-thumb {
    position: absolute;
    top: 0;
    left: 0;
    width: 7px;
    min-height: 36px;
    background: #2e3b52;
    border-radius: 4px;
    cursor: pointer;
  }
  .scroll-track:hover .scroll-thumb,
  .scroll-thumb.dragging {
    background: #60a5fa;
  }

  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1140px;
    height: 62px;
    background: #121721;
    border-top: 1px solid #222b3a;
    padding: 0 20px;
    display: block;
  }

  .row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .row-between {
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
  }
  .fill { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .topbar .row-main { height: 65px; }
  .footer .row-main { height: 61px; }

  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #f0f6fc;
    margin-right: 16px;
  }

  /* Вкладки в шапке */
  .tabs-bar { display: -webkit-box; display: -webkit-flex; display: flex; }
  .tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #8b949e;
    padding: 8px 14px;
    margin-right: 6px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .tab-btn:hover { background: #192130; color: #e6edf3; }
  .tab-btn.active {
    background: rgba(59, 130, 246, 0.16);
    border-color: rgba(59, 130, 246, 0.4);
    color: #60a5fa;
  }
  .tab-icon { width: 15px; height: 15px; margin-right: 7px; fill: currentColor; }

  /* Поиск */
  .search-box { position: relative; width: 250px; display: block; }
  .search-box input {
    width: 100%;
    background: #0b0e14;
    border: 1px solid #283242;
    color: #f0f6fc;
    padding: 7px 12px 7px 30px;
    border-radius: 8px;
    font-size: 12px;
    outline: none;
    display: block;
  }
  .search-box input:focus { border-color: #3b82f6; }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 9px;
    width: 13px;
    height: 13px;
    fill: #6e7681;
    pointer-events: none;
  }

  /* Сайдбар */
  .sidebar-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6e7681;
    padding: 4px 10px 8px 10px;
  }
  .nav-item {
    display: block;
    width: 100%;
    background: transparent;
    color: #8b949e;
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .nav-item:hover { background: #18202d; color: #f0f6fc; }
  .nav-item.active {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    font-weight: 600;
  }
  .nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3b4659;
    margin-right: 10px;
  }
  .nav-item.active .nav-dot { background: #60a5fa; }
  .nav-count {
    font-size: 11px;
    background: #1c2433;
    color: #8b949e;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .nav-item.active .nav-count { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }

  .section-header {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: #60a5fa;
    margin: 16px 0 8px 2px;
  }
  .section-header.first { margin-top: 0; }

  /* Карточка параметра */
  .card {
    display: block;
    background: #151b26;
    border: 1px solid #222b3a;
    border-left: 3px solid #222b3a;
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 9px;
  }
  .card:hover { background: #192130; border-color: #2f3b4f; }
  .card.modified { border-left-color: #3b82f6; background: #161f2e; }
  .card.locked {
    background: #121720;
    border-color: #1e2634;
    border-left-color: #f59e0b;
  }
  .card.locked .card-control {
    opacity: 0.38;
    pointer-events: none;
  }
  .card-info { padding-right: 18px; display: block; }
  .card-title-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-bottom: 4px;
  }
  .card-title { font-size: 13.5px; font-weight: 600; color: #f0f6fc; margin-right: 8px; }
  .card.locked .card-title { color: #9ca3af; }
  .card-desc { display: block; font-size: 12px; color: #8b949e; line-height: 1.35; }

  /* Плашка причины неактивности параметра */
  .card-lock-reason {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-top: 6px;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.28);
    color: #fbbf24;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.3;
  }
  .card-lock-reason svg {
    width: 12px;
    height: 12px;
    fill: #fbbf24;
    margin-right: 6px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  /* Ровная SVG-иконка подсказки */
  .hint-icon {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #60a5fa;
    cursor: help;
    margin-right: 8px;
  }
  .hint-icon:hover { background: #3b82f6; color: #ffffff; border-color: #60a5fa; }
  .hint-icon svg { width: 11px; height: 11px; fill: currentColor; pointer-events: none; }

  /* Всплывающая подсказка */
  #tooltip {
    display: none;
    position: absolute;
    z-index: 300;
    width: 320px;
    background: #0b0e14;
    border: 1px solid #3b82f6;
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
  .tt-title { display: block; font-size: 13px; font-weight: 700; color: #60a5fa; margin-bottom: 5px; }
  .tt-body { display: block; font-size: 12px; color: #d0d7de; line-height: 1.4; margin-bottom: 6px; }
  .tt-lock {
    display: none;
    font-size: 11.5px;
    color: #fbbf24;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 6px;
    line-height: 1.35;
    font-weight: 600;
  }

  /* Тумблер (Switch) */
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    background: #283242;
    border-radius: 24px;
    cursor: pointer;
    -webkit-transition: background .18s;
    transition: background .18s;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .switch.on { background: #3b82f6; }
  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    -webkit-transition: left .18s;
    transition: left .18s;
  }
  .switch.on .knob { left: 23px; }

  /* Ползунок (Range) */
  .range-val {
    font-weight: 700;
    color: #60a5fa;
    min-width: 48px;
    text-align: right;
    font-size: 13.5px;
    margin-left: 10px;
  }
  .range { position: relative; width: 175px; height: 22px; cursor: pointer; }
  .range .track { position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: #263040; border-radius: 4px; }
  .range .fill { position: absolute; left: 0; top: 8px; height: 6px; background: #3b82f6; border-radius: 4px; }
  .range .thumb { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #60a5fa; box-shadow: 0 0 6px rgba(59,130,246,0.6); }

  /* Кнопки выбора вариантов (всегда в виде кнопок) */
  .btn-group {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    background: #0b0e14;
    border: 1px solid #283242;
    border-radius: 8px;
    padding: 3px;
  }
  .opt-btn {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    cursor: pointer;
    margin-right: 2px;
    white-space: nowrap;
  }
  .opt-btn.last { margin-right: 0; }
  .opt-btn:hover { color: #f0f6fc; background: #161d29; }
  .opt-btn.active { background: #3b82f6; color: #ffffff; }

  /* Кнопка назначения клавиши (Keybind) */
  .keybind-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .keybind-btn {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-width: 140px;
    height: 34px;
    padding: 0 14px;
    background: #0b0e14;
    border: 1px solid #303c52;
    border-bottom: 2px solid #3b4b66;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: #60a5fa;
    cursor: pointer;
  }
  .keybind-btn:hover { border-color: #60a5fa; background: #131a26; color: #93c5fd; }
  .keybind-btn.listening {
    background: rgba(245, 158, 11, 0.16);
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .keybind-btn.unbound { color: #6e7681; font-weight: 500; }

  /* Идеально отцентрированная SVG-кнопка очистки привязки клавиши */
  .keybind-clear {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    margin-left: 6px;
    border-radius: 8px;
    background: #141a24;
    border: 1px solid #283242;
    border-bottom: 2px solid #303c52;
    color: #8b949e;
    cursor: pointer;
  }
  .keybind-clear svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
    display: block;
    pointer-events: none;
  }
  .keybind-clear:hover {
    border-color: #ef4444;
    border-bottom-color: #dc2626;
    color: #f87171;
    background: rgba(239, 68, 68, 0.12);
  }

  /* Нижняя панель */
  .legacy-label {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    cursor: pointer;
    font-size: 12.5px;
    color: #c9d1d9;
    background: #161d29;
    border: 1px solid #2b3547;
    padding: 7px 12px;
    border-radius: 7px;
    margin-right: 10px;
  }
  .legacy-label:hover { border-color: #60a5fa; color: #fff; }
  .legacy-box {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    border: 1px solid #485263;
    border-radius: 3px;
    background: #0d1117;
  }
  .legacy-label.on .legacy-box { background: #3b82f6; border-color: #3b82f6; }

  .conn-pill {
    font-size: 11px;
    color: #4ade80;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.25);
    padding: 4px 9px;
    border-radius: 6px;
    margin-right: 8px;
  }
  .conn-pill.wait { color: #fbbf24; background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); }

  .btn {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    margin-left: 8px;
  }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary.disabled { opacity: 0.42; cursor: default; }
  .btn-ghost { background: transparent; color: #8b949e; border-color: #2b3547; }
  .btn-ghost:hover { color: #f0f6fc; border-color: #485263; }

  .status-msg { font-size: 12.5px; font-weight: 600; color: #4ade80; margin-right: 8px; display: none; }
  .status-msg.show { display: inline-block; }
  .empty { display: block; color: #8b949e; font-size: 13px; padding: 36px 0; text-align: center; }
</style>
</head>
<body>

  <div class="modal-window" id="modalWindow">
    <div id="tooltip">
      <div class="tt-title" id="ttTitle"></div>
      <div class="tt-body" id="ttBody"></div>
      <div class="tt-lock" id="ttLock"></div>
    </div>

    <div class="topbar">
      <div class="row row-between row-main">
        <div class="row">
          <div class="brand">НАСТРОЙКИ</div>
          <div class="tabs-bar" id="tabsBar"></div>
        </div>
        <div class="row">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск по параметрам...">
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="scroll-body" id="sidebarBody"></div>
    </div>

    <div class="content" id="content">
      <div class="scroll-body" id="contentBody"></div>
      <div class="scroll-track" id="contentScrollTrack">
        <div class="scroll-thumb" id="contentScrollThumb"></div>
      </div>
    </div>

    <div class="footer">
      <div class="row row-between row-main">
        <div class="row">
          <div class="legacy-label" id="chkLegacy" title="Переключиться на стандартное окно настроек клиента">
            <span class="legacy-box"></span><span>Классические настройки</span>
          </div>
          <div class="btn btn-ghost" id="btnReset" style="display:none;">Отменить правки</div>
        </div>
        <div class="row">
          <span class="conn-pill wait" id="connPill">Синхронизация...</span>
          <span class="status-msg" id="statusMsg">Изменения применены!</span>
          <div class="btn btn-ghost" id="btnClose">Закрыть (Esc)</div>
          <div class="btn btn-primary disabled" id="btnSave">Применить</div>
        </div>
      </div>
    </div>
  </div>

<script src="coui://gui/gameface/mods/modern_settings/bridge.js"></script>

  // Человекочитаемые названия клавиш BigWorld
  var KEY_LABELS = {
    'KEY_NONE': 'Не назначено',
    'KEY_LEFTMOUSE': 'ЛКМ (Мышь 1)',
    'KEY_RIGHTMOUSE': 'ПКМ (Мышь 2)',
    'KEY_MIDDLEMOUSE': 'СКМ (Колесо)',

    'KEY_PGDN': 'Page Down',

    'KEY_DOWNARROW': 'Стрелка Вниз',
    'KEY_LEFTARROW': 'Стрелка Влево',
    'KEY_RIGHTARROW': 'Стрелка Вправо',
    'KEY_EQUALS': '= (+)',
    'KEY_MINUS': '- (_)',
    'KEY_LBRACKET': '[ (Х)',
    'KEY_RBRACKET': '] (Ъ)',
    'KEY_SEMICOLON': '; (Ж)',
    'KEY_APOSTROPHE': '\' (Э)',
    'KEY_COMMA': ', (Б)',
    'KEY_PERIOD': '. (Ю)',
    'KEY_SLASH': '/ (.)',
    'KEY_GRAVE': '~ (Ё)'
  };

  function formatKeyLabel(bwKey) {
    if (!bwKey) return 'Не назначено';
    if (KEY_LABELS[bwKey]) return KEY_LABELS[bwKey];
    return String(bwKey).replace(/^KEY_/, '');
  }

  var JS_CODE_TO_BW = {
    'Space': 'KEY_SPACE', 'ShiftLeft': 'KEY_LSHIFT', 'ShiftRight': 'KEY_RSHIFT',
    'ControlLeft': 'KEY_LCONTROL', 'ControlRight': 'KEY_RCONTROL',
    'AltLeft': 'KEY_LALT', 'AltRight': 'KEY_RALT', 'Tab': 'KEY_TAB',
    'CapsLock': 'KEY_CAPSLOCK', 'Enter': 'KEY_RETURN', 'NumpadEnter': 'KEY_NUMPADENTER',
    'ArrowUp': 'KEY_UPARROW', 'ArrowDown': 'KEY_DOWNARROW',
    'ArrowLeft': 'KEY_LEFTARROW', 'ArrowRight': 'KEY_RIGHTARROW',
    'Equal': 'KEY_EQUALS', 'Minus': 'KEY_MINUS',
    'BracketLeft': 'KEY_LBRACKET', 'BracketRight': 'KEY_RBRACKET',
    'Semicolon': 'KEY_SEMICOLON', 'Quote': 'KEY_APOSTROPHE',
    'Backquote': 'KEY_GRAVE', 'Comma': 'KEY_COMMA', 'Period': 'KEY_PERIOD', 'Slash': 'KEY_SLASH',
    'Insert': 'KEY_INSERT', 'Home': 'KEY_HOME', 'End': 'KEY_END',
    'PageUp': 'KEY_PGUP', 'PageDown': 'KEY_PGDN'
  };

  function jsKeyEventToBwKey(e) {
    var code = e.code || '';
    if (JS_CODE_TO_BW[code]) return JS_CODE_TO_BW[code];
    if (/^Key([A-Z])$/.test(code)) return 'KEY_' + code.slice(3);
    if (/^Digit([0-9])$/.test(code)) return 'KEY_' + code.slice(5);
    if (/^F([1-9]|1[0-2])$/.test(code)) return 'KEY_' + code;
    if (/^Numpad([0-9])$/.test(code)) return 'KEY_NUMPAD' + code.slice(6);
    var kc = e.keyCode || e.which || 0;
    if (kc >= 65 && kc <= 90) return 'KEY_' + String.fromCharCode(kc);
    if (kc >= 48 && kc <= 57) return 'KEY_' + String.fromCharCode(kc);
    if (kc === 32) return 'KEY_SPACE';
    if (kc === 16) return 'KEY_LSHIFT';
    if (kc === 17) return 'KEY_LCONTROL';
    if (kc === 18) return 'KEY_LALT';
    if (kc === 9) return 'KEY_TAB';
    if (kc === 20) return 'KEY_CAPSLOCK';
    if (kc === 187) return 'KEY_EQUALS';
    if (kc === 189) return 'KEY_MINUS';
    if (kc >= 112 && kc <= 123) return 'KEY_F' + (kc - 111);
    return null;
  }

  if (!window.initialState) {
    window.initialState = {
      fovStatic: 100, fovMin: 80, fovMax: 120, dynamicFov: false,
      dynamicCamera: true, horStabilizationSnp: true, increasedZoom: true,
      commanderCam: true, preCommanderCam: true, minimapAlphaEnabled: false,
      carouselType: 1, RENDER_PIPELINE: 0, vertSync: false,
      DRR_AUTOSCALER_ENABLED: false, TERRAIN_QUALITY: 0, FLORA_QUALITY: 0,
      EFFECTS_QUALITY: 0, masterVolumeToggle: true, enableVoIP: false
    };
    window.currentState = {};
    for (var ik in window.initialState) {
      window.currentState[ik] = window.initialState[ik];
    }
    window.supported = null;
  }

  function isSupported(key) {
    return window.supported === null || window.supported[key] === true;
  }

  // Точное определение причин неактивности параметров (как в оригинальных настройках игры)
  function getLockReason(item) {
    var s = window.currentState || {};
    var k = item.key;

    // 1. Внутриигровые зависимости между настройками
    if (k === 'fovStatic' && s.dynamicFov) {
      return 'Неактивно: включён параметр «Динамическое изменение угла обзора». Отключите его, чтобы задать фиксированный угол.';

    });

    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'По вашему запросу ничего не найдено.';
      contentBodyEl.appendChild(e);
    }

    contentScrollY = savedScroll;
    updateContentScrollUI();
    setTimeout(updateContentScrollUI, 16);
  }
  window.renderContent = renderContent;

  document.getElementById('searchInput').oninput = function (e) {
    searchQuery = e.target.value.trim();
    contentScrollY = 0;
    renderTabs();
    renderContent(true);
  };

  btnReset.onclick = function () {
    listeningKeyId = null;
    for (var k in window.initialState) {
      window.currentState[k] = window.initialState[k];
    }
    renderContent(true);
    updateFooterState();
  };

  btnSave.onclick = function () {
    if (getModifiedCount() === 0) return;
    btnSave.className = 'btn btn-primary disabled';
    send('/api/apply', window.currentState, function (ok) {
      if (!ok) {
        statusMsg.textContent = 'Ошибка сохранения';
        statusMsg.style.color = '#ef4444';
      } else {
        for (var k in window.currentState) {
          window.initialState[k] = window.currentState[k];
        }
        statusMsg.textContent = 'Настройки применены!';
        statusMsg.style.color = '#4ade80';
      }
      renderContent(true);
      updateFooterState();
      statusMsg.className = 'status-msg show';
      setTimeout(function () { statusMsg.className = 'status-msg'; }, 2400);
    });
  };

  var legacyEl = document.getElementById('chkLegacy');
  legacyEl.onclick = function () {
    var on = legacyEl.className.indexOf(' on') < 0;
    legacyEl.className = 'legacy-label' + (on ? ' on' : '');
    if (on) send('/api/use_legacy', { permanent: true });
  };

  document.getElementById('btnClose').onclick = function () {
    send('/api/close', {});
  };

  var PANEL_W = 1140, PANEL_H = 710;
  function fitPanel() {
    var vw = window.innerWidth || document.documentElement.clientWidth || PANEL_W;
    var vh = window.innerHeight || document.documentElement.clientHeight || PANEL_H;
    var k = Math.min(Math.min(vw / PANEL_W, vh / PANEL_H) * 0.92, 2.5);
    currentScale = k || 1;
    var x = Math.round((vw - PANEL_W * k) / 2);
    var y = Math.round((vh - PANEL_H * k) / 2);
    modalEl.style.left = x + 'px';
    modalEl.style.top = y + 'px';
    modalEl.style.webkitTransform = modalEl.style.transform = 'scale(' + k + ')';
    updateContentScrollUI();
  }

  window.addEventListener('resize', fitPanel);
  fitPanel();
  setTimeout(fitPanel, 250);

  renderTabs();
  renderSidebar();
  renderContent(true);
  updateFooterState();
</script>
</body>
</html>
