<!DOCTYPE html>
<html lang="ru" style="width: 100vw; height: 100vh;">
<head>
<meta charset="UTF-8">
<title>Настройки игры</title>
<style>
  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
  }
  input[type="text"] { -webkit-user-select: text; user-select: text; }

  html, body {
    width: 100%;
    height: 100%;
    background: rgba(5, 8, 13, 0.78);
    color: #f0f6fc;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    overflow: hidden;
    position: relative;
    display: block;
  }

  /* Окно рендерится 1:1 в целых пикселях БЕЗ transform:scale(), чтобы шрифты и иконки были идеально чёткими */
  .modal-window {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 740px;
    background: #0c1017;
    border: 1px solid #263042;
    border-radius: 12px;
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.92);
    overflow: hidden;
    display: block;
  }

  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 68px;
    background: #111722;
    border-bottom: 1px solid #222c3c;
    padding: 0 20px;
    display: block;
    z-index: 40;
  }

  .sidebar {
    position: absolute;
    top: 68px;
    left: 0;
    width: 268px;
    height: 610px;
    background: #0f141e;
    border-right: 1px solid #222c3c;
    padding: 14px 12px;
    overflow: hidden;
    display: block;
  }

  .content {
    position: absolute;
    top: 68px;
    left: 268px;
    width: 932px;
    height: 610px;
    padding: 18px 26px 18px 22px;
    overflow: hidden;
    display: block;
  }

  .scroll-body {
    display: block;
    width: 100%;
    -webkit-transform: translateY(0px);
    transform: translateY(0px);
  }

  /* Кастомный скроллбар */
  .scroll-track {
    position: absolute;
    top: 10px;
    right: 6px;
    width: 7px;
    height: 590px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    cursor: pointer;
    z-index: 25;
    display: none;
  }
  .scroll-thumb {
    position: absolute;
    top: 0;
    left: 0;
    width: 7px;
    min-height: 36px;
    background: #364560;
    border-radius: 4px;
    cursor: pointer;
  }

  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1200px;
    height: 62px;
    background: #111722;
    border-top: 1px solid #222c3c;
    padding: 0 20px;
    display: block;
    z-index: 40;
  }

  .row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .row-between {
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
  }
  .fill { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .topbar .row-main { height: 67px; }
  .footer .row-main { height: 61px; }

  .brand-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-right: 16px;
  }
  .brand-emblem {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    margin-right: 10px;
    background: rgba(245, 158, 11, 0.16);
    border: 1px solid rgba(245, 158, 11, 0.42);
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #f0f6fc;
  }

  /* Вкладки в шапке */
  .tabs-bar { display: -webkit-box; display: -webkit-flex; display: flex; }
  .tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #9ca3af;
    padding: 8px 14px;
    margin-right: 6px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .tab-btn:hover { background: #192231; color: #f0f6fc; }
  .tab-icon-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-right: 8px;
  }

  /* Кнопки кастомизации и фильтра в шапке */
  .top-action-btn {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    height: 34px;
    padding: 0 11px;
    margin-right: 8px;
    border-radius: 8px;
    background: #161e2c;
    border: 1px solid #283448;
    color: #c9d1d9;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .top-action-btn:hover { border-color: #4b5b76; color: #ffffff; background: #1b2536; }
  .theme-dot-preview {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 7px;
    background: #fbbf24;
  }

  /* Выпадающая панель выбора цветовой темы и размера шрифта */
  #themePopup {
    display: none;
    position: absolute;
    top: 62px;
    right: 255px;
    width: 320px;
    background: #101622;
    border: 1px solid #384863;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.94);
    z-index: 280;
  }
  .tp-title {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: #8b949e;
    margin-bottom: 8px;
  }
  .tp-grid {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .tp-swatch {
    width: 140px;
    padding: 7px 9px;
    margin: 0 6px 6px 0;
    border-radius: 7px;
    background: #161e2d;
    border: 1px solid #263144;
    cursor: pointer;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .tp-swatch:hover { background: #1c2638; border-color: #4b5d7e; }
  .tp-swatch.active { border-color: #f0f6fc; background: #222e44; }
  .tp-color {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-right: 8px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .tp-name { font-size: 12px; font-weight: 600; color: #e6edf3; }

  /* Поиск */
  .search-box { position: relative; width: 225px; display: block; }
  .search-box input {
    width: 100%;
    height: 34px;
    background: #0b0e14;
    border: 1px solid #283242;
    color: #f0f6fc;
    padding: 6px 12px 6px 30px;
    border-radius: 8px;
    font-size: 12.5px;
    outline: none;
    display: block;
  }
  .search-icon-wrap {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 14px;
    height: 14px;
    pointer-events: none;
  }

  /* Сайдбар с иконками разделов */
  .sidebar-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6e7681;
    padding: 4px 10px 8px 10px;
  }
  .nav-item {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: #9ca3af;
    padding: 9px 11px;
    margin-bottom: 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .nav-item:hover { background: #171f2e; color: #f0f6fc; }
  .nav-icon-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-right: 9px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .nav-count {
    font-size: 11px;
    background: #1a2232;
    color: #8b949e;
    padding: 2px 7px;
    border-radius: 10px;
  }

  .section-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin: 16px 0 9px 2px;
    color: #fbbf24;
  }
  .section-header.first { margin-top: 0; }
  .sec-icon-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-right: 7px;
  }

  /* Визуальный баннер-иллюстрация раздела (Миникарта, Экран/FOV) */
  .visual-banner {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    background: #121824;
    border: 1px solid #243044;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 11px;
  }
  .vb-info { padding-right: 16px; display: block; }
  .vb-title { display: block; font-size: 13px; font-weight: 700; color: #f0f6fc; margin-bottom: 4px; }
  .vb-desc { display: block; font-size: 12px; color: #8b949e; line-height: 1.38; }
  .vb-legend {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .vb-pill {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    color: #c9d1d9;
    background: #0b0f17;
    border: 1px solid #232e42;
    border-radius: 6px;
    padding: 3px 8px;
    margin: 0 6px 5px 0;
  }
  .vb-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .vb-canvas {
    width: 156px;
    height: 124px;
    background: #0a0e15;
    border: 1px solid #283449;
    border-radius: 8px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    overflow: hidden;
  }

  /* Карточка параметра с иконкой слева */
  .card {
    display: block;
    background: #141b27;
    border: 1px solid #222c3d;
    border-left: 3px solid #222c3d;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .card:hover { background: #182130; border-color: #2f3d54; }
  .card.locked {
    background: #111620;
    border-color: #1d2533;
    border-left-color: #f59e0b;
  }
  .card.locked .card-control {
    opacity: 0.38;
    pointer-events: none;
  }
  .card-icon-badge {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    margin-right: 13px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .card-info { padding-right: 18px; display: block; }
  .card-title-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-bottom: 3px;
  }
  .card-title { font-size: 13.5px; font-weight: 600; color: #f0f6fc; margin-right: 8px; }
  .card.locked .card-title { color: #9ca3af; }
  .card-desc { display: block; font-size: 12px; color: #9ca3af; line-height: 1.35; }

  /* Кнопка индивидуального сброса параметра к исходному значению */
  .card-revert-btn {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #c9d1d9;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 4px;
  }
  .card-revert-btn:hover { background: rgba(239, 68, 68, 0.16); border-color: #ef4444; color: #fca5a5; }

  /* Укрупнённый режим шрифта */
  body.font-large .card-title { font-size: 15px; }
  body.font-large .card-desc { font-size: 13px; }
  body.font-large .nav-item { font-size: 14px; padding: 10px 11px; }
  body.font-large .opt-btn { font-size: 13px; padding: 7px 12px; }
  body.font-large .keybind-btn { font-size: 13.5px; }

  /* Плашка причины неактивности параметра или конфликта клавиш */
  .card-lock-reason {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-top: 6px;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.28);
    color: #fbbf24;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.3;
  }
  .card-lock-reason.conflict {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.35);
    color: #f87171;
  }
  .lock-icon-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    margin-right: 6px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  /* Иконка подсказки */
  .hint-icon {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    cursor: help;
    margin-right: 6px;
    background: rgba(245, 158, 11, 0.16);
    border: 1px solid rgba(245, 158, 11, 0.42);
  }

  /* Всплывающая подсказка */
  #tooltip {
    display: none;
    position: absolute;
    z-index: 300;
    width: 325px;
    background: #0b0e14;
    border: 1px solid #d97706;
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.92);
    pointer-events: none;
  }
  .tt-title { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #fbbf24; }
  .tt-body { display: block; font-size: 12px; color: #d0d7de; line-height: 1.4; margin-bottom: 6px; }
  .tt-lock {
    display: none;
    font-size: 11.5px;
    color: #fbbf24;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 6px;
    line-height: 1.35;
    font-weight: 600;
  }

  /* Тумблер (Switch) */
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    background: #283242;
    border-radius: 24px;
    cursor: pointer;
    -webkit-transition: background .18s;
    transition: background .18s;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    -webkit-transition: left .18s;
    transition: left .18s;
  }
  .switch.on { background: #d97706; }
  .switch.on .knob { left: 23px; }

  /* Ползунок (Range) */
  .range-val {
    font-weight: 700;
    min-width: 48px;
    text-align: right;
    font-size: 13.5px;
    margin-left: 10px;
    color: #fbbf24;
  }
  .range { position: relative; width: 175px; height: 22px; cursor: pointer; }
  .range .track { position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: #263040; border-radius: 4px; }
  .range .fill { position: absolute; left: 0; top: 8px; height: 6px; border-radius: 4px; background: #d97706; }
  .range .thumb { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fbbf24; }

  /* Кнопки выбора вариантов */
  .btn-group {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    background: #0b0e14;
    border: 1px solid #283242;
    border-radius: 8px;
    padding: 3px;
  }
  .btn-group.wrap-res {
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    -webkit-box-pack: end;
    -webkit-justify-content: flex-end;
    justify-content: flex-end;
    max-width: 430px;
  }
  .opt-btn {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    cursor: pointer;
    margin: 1px 2px;
    white-space: nowrap;
  }
  .opt-btn.last { margin-right: 0; }
  .opt-btn:hover { color: #f0f6fc; background: #161d29; }
  .opt-btn.active { background: #d97706; color: #ffffff; }

  /* Кнопка назначения клавиши (Keybind) */
  .keybind-wrap {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .keybind-btn {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-width: 140px;
    height: 34px;
    padding: 0 14px;
    background: #0b0e14;
    border: 1px solid #303c52;
    border-bottom: 2px solid #3b4b66;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: #fbbf24;
    cursor: pointer;
  }
  .keybind-btn.listening {
    background: rgba(245, 158, 11, 0.16);
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .keybind-btn.unbound { color: #6e7681; font-weight: 500; }

  .keybind-clear {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    margin-left: 6px;
    border-radius: 8px;
    background: #141a24;
    border: 1px solid #283242;
    border-bottom: 2px solid #303c52;
    color: #8b949e;
    cursor: pointer;
  }
  .keybind-clear:hover {
    border-color: #ef4444;
    border-bottom-color: #dc2626;
    background: rgba(239, 68, 68, 0.14);
  }

  /* Нижняя панель */
  .legacy-label {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    cursor: pointer;
    font-size: 12.5px;
    color: #c9d1d9;
    background: #161d29;
    border: 1px solid #2b3547;
    padding: 7px 12px;
    border-radius: 7px;
    margin-right: 10px;
  }
  .legacy-label:hover { border-color: #6e7681; color: #fff; }
  .legacy-box {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;

  function getResolutionOptions() {
    var list = window.availableResolutions || [];
    var cur = (window.currentState && window.currentState.screenResolution) || '1920x1080';
    var res = [];
    var seen = {};
    for (var i = 0; i < list.length; i++) {
      var r = String(list[i]);
      if (!seen[r]) {
        seen[r] = true;
        res.push({ v: r, l: r.replace('x', ' × ') });
      }
    }
    if (!seen[cur]) {
      res.push({ v: cur, l: cur.replace('x', ' × ') });
    }
    return res;
  }

  function formatKeyLabel(bwKey) {
    if (!bwKey) return 'Не назначено';
    if (KEY_LABELS[bwKey]) return KEY_LABELS[bwKey];
    return String(bwKey).replace(/^KEY_/, '');
  }

  var JS_CODE_TO_BW = {
    'Space': 'KEY_SPACE', 'ShiftLeft': 'KEY_LSHIFT', 'ShiftRight': 'KEY_RSHIFT',
    'ControlLeft': 'KEY_LCONTROL', 'ControlRight': 'KEY_RCONTROL',
    'AltLeft': 'KEY_LALT', 'AltRight': 'KEY_RALT', 'Tab': 'KEY_TAB',
    'CapsLock': 'KEY_CAPSLOCK', 'Enter': 'KEY_RETURN', 'NumpadEnter': 'KEY_NUMPADENTER',
    'ArrowUp': 'KEY_UPARROW', 'ArrowDown': 'KEY_DOWNARROW',
    'ArrowLeft': 'KEY_LEFTARROW', 'ArrowRight': 'KEY_RIGHTARROW',
    'Equal': 'KEY_EQUALS', 'Minus': 'KEY_MINUS',
    'BracketLeft': 'KEY_LBRACKET', 'BracketRight': 'KEY_RBRACKET',
    'Semicolon': 'KEY_SEMICOLON', 'Quote': 'KEY_APOSTROPHE',
    'Backquote': 'KEY_GRAVE', 'Comma': 'KEY_COMMA', 'Period': 'KEY_PERIOD', 'Slash': 'KEY_SLASH',
    'Insert': 'KEY_INSERT', 'Home': 'KEY_HOME', 'End': 'KEY_END',
    'PageUp': 'KEY_PGUP', 'PageDown': 'KEY_PGDN'
  };

  function jsKeyEventToBwKey(e) {
    var code = e.code || '';
    if (JS_CODE_TO_BW[code]) return JS_CODE_TO_BW[code];
    if (/^Key([A-Z])$/.test(code)) return 'KEY_' + code.slice(3);
    if (/^Digit([0-9])$/.test(code)) return 'KEY_' + code.slice(5);
    if (/^F([1-9]|1[0-2])$/.test(code)) return 'KEY_' + code;
    if (/^Numpad([0-9])$/.test(code)) return 'KEY_NUMPAD' + code.slice(6);
    var kc = e.keyCode || e.which || 0;
    if (kc >= 65 && kc <= 90) return 'KEY_' + String.fromCharCode(kc);
    if (kc >= 48 && kc <= 57) return 'KEY_' + String.fromCharCode(kc);
    if (kc === 32) return 'KEY_SPACE';
    if (kc === 16) return 'KEY_LSHIFT';
    if (kc === 17) return 'KEY_LCONTROL';
    if (kc === 18) return 'KEY_LALT';
    if (kc === 9) return 'KEY_TAB';
    if (kc === 20) return 'KEY_CAPSLOCK';
    if (kc === 187) return 'KEY_EQUALS';
    if (kc === 189) return 'KEY_MINUS';
    if (kc >= 112 && kc <= 123) return 'KEY_F' + (kc - 111);
    return null;
  }

    }
    var wrapped;
    if (cb) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; cb(true); } }, 450);
      wrapped = function (ok) { if (done) return; done = true; clearTimeout(timer); cb(ok); };
    }
    window.postJSON(url, data, wrapped);
  }

  function applyCapturedKey(bindKey, bwKeyName) {
    if (!bindKey || listeningKeyId !== bindKey) return;
    listeningKeyId = null;
    send('/api/listen_key', { key: '' });
    if (bwKeyName && bwKeyName !== 'CANCEL') {
      window.currentState[bindKey] = bwKeyName;
    }
    renderContent(true);
    updateFooterState();
  }

  window.__onPythonKeyCaptured = function (bindTarget, capturedKey) {
    applyCapturedKey(bindTarget, capturedKey);
  };

  window.addEventListener('keydown', function (e) {
    var kc = e.keyCode || e.which || 0;
    if (listeningKeyId) {
      e.preventDefault();
      e.stopPropagation();
      if (kc === 27 || e.key === 'Escape') {
        applyCapturedKey(listeningKeyId, 'CANCEL');
        return;
      }
      if (kc === 8 || kc === 46 || e.key === 'Backspace' || e.key === 'Delete') {
        applyCapturedKey(listeningKeyId, 'KEY_NONE');
        return;
      }
      var bw = jsKeyEventToBwKey(e);
      if (bw) {
        applyCapturedKey(listeningKeyId, bw);
      }
      return;
    }

    if (document.activeElement === document.getElementById('searchInput')) {
      return;
    }
    if (kc === 34 || e.key === 'PageDown') {
      setContentScroll(contentScrollY + 360);
    } else if (kc === 33 || e.key === 'PageUp') {
      setContentScroll(contentScrollY - 360);
    } else if (kc === 40 || e.key === 'ArrowDown') {
      setContentScroll(contentScrollY + 80);
    } else if (kc === 38 || e.key === 'ArrowUp') {
      setContentScroll(contentScrollY - 80);
    }
  }, true);

  function getModifiedCount() {
    var n = 0;
    for (var key in window.currentState) {
      if (key === 'uiTheme' || key === 'uiFontScale') continue;
      if (window.currentState[key] !== window.initialState[key]) n++;
    }
    return n;
  }

  function updateFooterState() {
    var n = getModifiedCount();
    var t = THEMES[currentThemeId] || THEMES.amber;
    btnSave.className = 'btn btn-primary' + (n === 0 ? ' disabled' : '');
    btnSave.style.backgroundColor = t.primary;
    btnSave.textContent = n > 0 ? 'Применить (' + n + ')' : 'Применить';
    btnReset.style.display = n > 0 ? 'inline-block' : 'none';

    if (n > 0 || filterOnlyModified) {
      btnOnlyModified.style.display = 'flex';
      btnOnlyModified.className = 'top-action-btn' + (filterOnlyModified ? ' active' : '');
      btnOnlyModified.style.backgroundColor = filterOnlyModified ? t.softBg : '#161e2c';
      btnOnlyModified.style.borderColor = filterOnlyModified ? t.softBorder : '#283448';
      btnOnlyModified.style.color = filterOnlyModified ? t.light : '#c9d1d9';
      onlyModifiedText.textContent = 'Изменённые (' + n + ')';
    } else {
      btnOnlyModified.style.display = 'none';
    }

    if (window.model && window.__bridgeDiag && window.__bridgeDiag.stateLen > 0) {
      connPill.textContent = 'Связь с клиентом: Активна';
      connPill.className = 'conn-pill';
    }
  }
  window.updateFooterState = updateFooterState;

  function showHint(item, lockReason, clientX, clientY) {
    var t = THEMES[currentThemeId] || THEMES.amber;
    ttTitle.textContent = item.title;
    ttTitle.style.color = t.light;
    ttBody.textContent = item.hint || item.desc;
    tooltipEl.style.borderColor = t.primary;
    if (lockReason) {
      ttLock.style.display = 'block';
      ttLock.textContent = lockReason;
    } else {
      ttLock.style.display = 'none';
      ttLock.textContent = '';
    }
    tooltipEl.style.display = 'block';

    var rect = modalEl.getBoundingClientRect();
    var rx = (clientX - rect.left) + 16;
    var ry = (clientY - rect.top) - 10;
    if (rx + 340 > panelW - 15) rx = rx - 355;
    if (ry + 150 > panelH - 15) ry = panelH - 165;
    if (ry < 10) ry = 10;
    tooltipEl.style.left = Math.round(rx) + 'px';
    tooltipEl.style.top = Math.round(ry) + 'px';
  }

  function hideHint() {
    tooltipEl.style.display = 'none';
  }

  function renderTabs() {
    var t = THEMES[currentThemeId] || THEMES.amber;
    tabsBarEl.innerHTML = '';
    TABS.forEach(function (tab) {
      var isAct = activeTab === tab.id && !searchQuery && !filterOnlyModified;
      var btn = document.createElement('div');
      btn.className = 'tab-btn' + (isAct ? ' active' : '');
      btn.style.backgroundColor = isAct ? t.softBg : 'transparent';
      btn.style.borderColor = isAct ? t.softBorder : 'transparent';
      btn.style.color = isAct ? t.light : '#9ca3af';

      var iconColor = isAct ? t.light : '#9ca3af';
      btn.innerHTML = '<span class="tab-icon-wrap">' + makeSvg(tab.iconKey, iconColor, 16) + '</span><span>' + tab.title + '</span>';
      btn.onclick = function () {
        activeTab = tab.id;
        activeCategory = 'all';
        filterOnlyModified = false;
        contentScrollY = 0;
        if (searchQuery) {
          searchQuery = '';
          document.getElementById('searchInput').value = '';
        }
        renderTabs();
        renderSidebar();
        renderContent(true);
        updateFooterState();
      };
      tabsBarEl.appendChild(btn);
    });
  }
  window.renderTabs = renderTabs;

  function renderSidebar() {
    var t = THEMES[currentThemeId] || THEMES.amber;
    sidebarBodyEl.innerHTML = '';
    var lbl = document.createElement('div');
    lbl.className = 'sidebar-label';
    lbl.textContent = 'Разделы вкладки';
    sidebarBodyEl.appendChild(lbl);

    var cats = CATEGORIES[activeTab] || [];
    cats.forEach(function (cat) {
      var count = SETTINGS_SCHEMA.filter(function (i) {
        return i.tab === activeTab && (cat.id === 'all' || i.cat === cat.id);
      }).length;
      var isAct = activeCategory === cat.id && !filterOnlyModified;
      var btn = document.createElement('div');
      btn.className = 'nav-item' + (isAct ? ' active' : '');
      btn.style.backgroundColor = isAct ? t.softBg : 'transparent';
      btn.style.borderColor = isAct ? t.softBorder : 'transparent';
      btn.style.color = isAct ? t.light : '#9ca3af';

      var iconColor = isAct ? t.light : '#8b949e';
      var countBg = isAct ? t.softBg : '#1a2232';
      var countCol = isAct ? t.light : '#8b949e';
      btn.innerHTML =
        '<div class="row row-between">' +
          '<div class="row"><span class="nav-icon-wrap">' + makeSvg(cat.id, iconColor, 15) + '</span><span>' + cat.title + '</span></div>' +
          '<span class="nav-count" style="background:' + countBg + ';color:' + countCol + ';">' + count + '</span>' +
        '</div>';
      btn.onclick = function () {
        activeCategory = cat.id;
        filterOnlyModified = false;
        contentScrollY = 0;
        renderTabs();
        renderSidebar();
        renderContent(true);
        updateFooterState();
      };
      sidebarBodyEl.appendChild(btn);
    });
  }
  window.renderSidebar = renderSidebar;

  function getCategoryTitle(tabId, catId) {
    var list = CATEGORIES[tabId] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === catId) return list[i].title;
    }
    return '';
  }

  function renderContent(preserveScroll) {
    var savedScroll = preserveScroll ? contentScrollY : 0;
    var t = THEMES[currentThemeId] || THEMES.amber;
    contentBodyEl.innerHTML = '';
    var q = searchQuery.toLowerCase();
    var lastGroup = null, shown = 0;

    if (!q && !filterOnlyModified) {
      if (activeTab === 'game' && (activeCategory === 'minimap' || activeCategory === 'all')) {
        contentBodyEl.appendChild(createMinimapVisualBanner());
      } else if (activeTab === 'graphics' && (activeCategory === 'display' || activeCategory === 'all')) {
        contentBodyEl.appendChild(createDisplayVisualBanner());
      }
    }

    SETTINGS_SCHEMA.forEach(function (item) {
      var isMod = window.currentState[item.key] !== window.initialState[item.key];
      if (filterOnlyModified && !isMod) return;

      var matchTab = (q || filterOnlyModified) ? true : (item.tab === activeTab);
      var matchCat = (q || filterOnlyModified) ? true : (activeCategory === 'all' || item.cat === activeCategory);
      var matchSearch = !q ||
        item.title.toLowerCase().indexOf(q) !== -1 ||
        item.desc.toLowerCase().indexOf(q) !== -1 ||
        (item.hint && item.hint.toLowerCase().indexOf(q) !== -1);

      if (!matchTab || !matchCat || !matchSearch) return;
      shown++;

      var groupKey = item.tab + ':' + item.cat;
      if ((activeCategory === 'all' || q || filterOnlyModified) && groupKey !== lastGroup) {
        var h = document.createElement('div');
        h.className = 'section-header' + (lastGroup === null ? ' first' : '');
        h.style.color = t.light;
        h.innerHTML = '<span class="sec-icon-wrap">' + makeSvg(item.cat, t.light, 14) + '</span><span>' + getCategoryTitle(item.tab, item.cat) + '</span>';
        contentBodyEl.appendChild(h);
        lastGroup = groupKey;
      }

      var lockReason = getLockReason(item);
      var conflictReason = getKeybindConflict(item);
      var locked = !!lockReason;
      var card = document.createElement('div');
      var refreshCard = function () {
        var modNow = window.currentState[item.key] !== window.initialState[item.key];
        card.className = 'card' + (modNow ? ' modified' : '') + (locked ? ' locked' : '');
        if (locked) {
          card.style.borderLeftColor = '#f59e0b';
          card.style.backgroundColor = '#111620';
        } else if (modNow) {
          card.style.borderLeftColor = t.primary;
          card.style.backgroundColor = t.cardModBg;
        } else {
          card.style.borderLeftColor = '#222c3d';
          card.style.backgroundColor = '#141b27';
        }
      };
      refreshCard();

      if (locked) {
        card.onmouseenter = function (e) { showHint(item, lockReason, e.clientX, e.clientY); };
        card.onmousemove = function (e) { showHint(item, lockReason, e.clientX, e.clientY); };
        card.onmouseleave = hideHint;
      }

      var row = document.createElement('div');
      row.className = 'row row-between';

      var leftWrap = document.createElement('div');
      leftWrap.className = 'row fill';

      var iconBadge = document.createElement('div');
      iconBadge.className = 'card-icon-badge';
      iconBadge.style.backgroundColor = locked ? 'rgba(245, 158, 11, 0.08)' : t.softBg;
      iconBadge.style.borderColor = locked ? 'rgba(245, 158, 11, 0.25)' : t.softBorder;
      iconBadge.innerHTML = makeSvg(item.cat, locked ? '#f59e0b' : t.light, 16);
      leftWrap.appendChild(iconBadge);

      var info = document.createElement('div');
      info.className = 'card-info fill';

      var titleRow = document.createElement('div');
      titleRow.className = 'card-title-row';

      var tSpan = document.createElement('span');
      tSpan.className = 'card-title';
      tSpan.textContent = item.title;
      titleRow.appendChild(tSpan);

      var qBadge = document.createElement('div');
      qBadge.className = 'hint-icon';
      qBadge.style.backgroundColor = t.softBg;
      qBadge.style.borderColor = t.softBorder;
      qBadge.innerHTML = makeSvg('info', t.light, 11);
      qBadge.onmouseenter = function (e) { showHint(item, lockReason, e.clientX, e.clientY); };
      qBadge.onmousemove = function (e) { showHint(item, lockReason, e.clientX, e.clientY); };
      qBadge.onmouseleave = hideHint;
      titleRow.appendChild(qBadge);

      if (isMod && !locked) {
        var revBtn = document.createElement('div');
        revBtn.className = 'card-revert-btn';
        revBtn.title = 'Вернуть исходное значение этого параметра';
        revBtn.textContent = '↺ Сброс';
        revBtn.onclick = function (e) {
          e.stopPropagation();
          window.currentState[item.key] = window.initialState[item.key];
          renderContent(true);
          updateFooterState();
        };
        titleRow.appendChild(revBtn);
      }

      var dDiv = document.createElement('div');
      dDiv.className = 'card-desc';
      dDiv.textContent = item.desc;

      info.appendChild(titleRow);
      info.appendChild(dDiv);

      if (locked && lockReason) {
        var lockBadge = document.createElement('div');
        lockBadge.className = 'card-lock-reason';
        lockBadge.innerHTML = '<span class="lock-icon-wrap">' + makeSvg('lock', '#fbbf24', 12) + '</span><span>' + lockReason + '</span>';
        info.appendChild(lockBadge);
      } else if (conflictReason) {
        var confBadge = document.createElement('div');
        confBadge.className = 'card-lock-reason conflict';
        confBadge.innerHTML = '<span class="lock-icon-wrap">' + makeSvg('warn', '#f87171', 12) + '</span><span>' + conflictReason + '</span>';
        info.appendChild(confBadge);
      }

      leftWrap.appendChild(info);
      row.appendChild(leftWrap);

      if (item.type === 'toggle') {
        var isOn = !!window.currentState[item.key];
        var sw = document.createElement('div');
        var knob = document.createElement('div');
        knob.className = 'knob';
        sw.appendChild(knob);
        sw.className = 'card-control switch' + (isOn ? ' on' : '');
        sw.style.backgroundColor = isOn ? t.primary : '#283242';
        if (!locked) {
          sw.onclick = function () {
            window.currentState[item.key] = !window.currentState[item.key];
            renderContent(true);
            updateFooterState();
          };
        }
        row.appendChild(sw);

      } else if (item.type === 'range') {
        var wrap = document.createElement('div');
        wrap.className = 'card-control row';
        var rng = document.createElement('div');
        rng.className = 'range';
        var track = document.createElement('div'); track.className = 'track';
        var fill = document.createElement('div'); fill.className = 'fill';
        fill.style.backgroundColor = t.primary;
        var thumb = document.createElement('div'); thumb.className = 'thumb';
        thumb.style.backgroundColor = t.light;
        rng.appendChild(track); rng.appendChild(fill); rng.appendChild(thumb);
        var valSpan = document.createElement('span');
        valSpan.className = 'range-val';
        valSpan.style.color = t.light;

        var setRange = function (v) {
          v = Math.max(item.min, Math.min(item.max, Math.round(v)));
          var pct = (v - item.min) / (item.max - item.min) * 100;
          fill.style.width = pct + '%';
          thumb.style.left = pct + '%';
          valSpan.textContent = v + (item.unit || '');
          return v;
        };
        var initVal = window.currentState[item.key];
        setRange(initVal !== undefined ? Number(initVal) : item.min);

        if (!locked) {
          var dragging = false;
          var fromX = function (clientX) {
            var r = track.getBoundingClientRect();
            var ratio = r.width > 0 ? (clientX - r.left) / r.width : 0;
            var v = setRange(item.min + Math.max(0, Math.min(1, ratio)) * (item.max - item.min));
            window.currentState[item.key] = v;
            refreshCard();
            updateFooterState();
          };
          rng.onmousedown = function (e) { dragging = true; fromX(e.clientX); };
          document.addEventListener('mousemove', function (e) { if (dragging) fromX(e.clientX); });
          document.addEventListener('mouseup', function () {
            if (dragging) {
              dragging = false;
              renderContent(true);
            }
          });
        }
        wrap.appendChild(rng);
        wrap.appendChild(valSpan);
        row.appendChild(wrap);

      } else if (item.type === 'segment' || item.type === 'resolution') {
        var optsList = item.type === 'resolution' ? getResolutionOptions() : item.options;
        var bGroup = document.createElement('div');
        bGroup.className = 'card-control btn-group' + (item.type === 'resolution' ? ' wrap-res' : '');
        optsList.forEach(function (opt, idx) {
          var b = document.createElement('div');
          var isLast = idx === optsList.length - 1;
          var isAct = item.type === 'resolution'
            ? (String(window.currentState[item.key]) === String(opt.v))
            : (Number(window.currentState[item.key]) === Number(opt.v));
          b.className = 'opt-btn' + (isAct ? ' active' : '') + (isLast ? ' last' : '');
          b.style.backgroundColor = isAct ? t.primary : 'transparent';
          b.style.color = isAct ? '#ffffff' : '#8b949e';
          b.textContent = opt.l;
          if (!locked) {
            b.onclick = function () {
              window.currentState[item.key] = opt.v;
              renderContent(true);
              updateFooterState();
            };
          }
          bGroup.appendChild(b);
        });
        row.appendChild(bGroup);

      } else if (item.type === 'keybind') {
        var kbWrap = document.createElement('div');
        kbWrap.className = 'card-control keybind-wrap';
        var curKeyStr = window.currentState[item.key] || 'KEY_NONE';
        var isListening = listeningKeyId === item.key;

        var kbBtn = document.createElement('div');
        kbBtn.className = 'keybind-btn' +
          (isListening ? ' listening' : '') +
          (curKeyStr === 'KEY_NONE' && !isListening ? ' unbound' : '');
        if (!isListening && curKeyStr !== 'KEY_NONE') {
          kbBtn.style.color = t.light;
        }
        kbBtn.textContent = isListening ? 'Нажмите клавишу...' : formatKeyLabel(curKeyStr);

        if (!locked) {
          kbBtn.onmousedown = function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (listeningKeyId === item.key) {
              var mouseMap = { 0: 'KEY_LEFTMOUSE', 1: 'KEY_MIDDLEMOUSE', 2: 'KEY_RIGHTMOUSE', 3: 'KEY_MOUSE4', 4: 'KEY_MOUSE5' };
              applyCapturedKey(item.key, mouseMap[e.button] || 'KEY_LEFTMOUSE');
            } else {
              listeningKeyId = item.key;
              send('/api/listen_key', { key: item.key });
              renderContent(true);
            }
          };

          var clrBtn = document.createElement('div');
          clrBtn.className = 'keybind-clear';
          clrBtn.title = 'Очистить привязку клавиши';
          clrBtn.innerHTML = makeSvg('clear', '#9ca3af', 12);
          clrBtn.onclick = function (e) {
            e.stopPropagation();
            listeningKeyId = null;
            send('/api/listen_key', { key: '' });
            window.currentState[item.key] = 'KEY_NONE';
            renderContent(true);
            updateFooterState();
          };
          kbWrap.appendChild(kbBtn);
          kbWrap.appendChild(clrBtn);
        } else {
          kbWrap.appendChild(kbBtn);
        }
        row.appendChild(kbWrap);
      }

      card.appendChild(row);
      contentBodyEl.appendChild(card);
    });

    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = filterOnlyModified ? 'Нет изменённых параметров.' : 'По вашему запросу ничего не найдено.';
      contentBodyEl.appendChild(e);
    }

    contentScrollY = savedScroll;
    updateContentScrollUI();
    setTimeout(updateContentScrollUI, 16);
  }
  window.renderContent = renderContent;

  document.getElementById('btnThemePicker').onclick = function (e) {
    e.stopPropagation();
    var isOpen = themePopupEl.style.display === 'block';
    themePopupEl.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) renderThemePopup();
  };

  document.addEventListener('click', function (e) {
    if (themePopupEl.style.display === 'block' && !themePopupEl.contains(e.target)) {
      themePopupEl.style.display = 'none';
    }
  });

  btnOnlyModified.onclick = function () {
    filterOnlyModified = !filterOnlyModified;
    contentScrollY = 0;
    renderTabs();
    renderSidebar();
    renderContent(true);
    updateFooterState();
  };

  document.getElementById('searchInput').oninput = function (e) {
    searchQuery = e.target.value.trim();
    contentScrollY = 0;
    renderTabs();
    renderContent(true);
  };

  btnReset.onclick = function () {
    listeningKeyId = null;
    filterOnlyModified = false;
    for (var k in window.initialState) {
      window.currentState[k] = window.initialState[k];
    }
    renderTabs();
    renderSidebar();
    renderContent(true);
    updateFooterState();
  };

  btnSave.onclick = function () {
    if (getModifiedCount() === 0) return;
    btnSave.className = 'btn btn-primary disabled';
    send('/api/apply', window.currentState, function (ok) {
      if (!ok) {
        statusMsg.textContent = 'Ошибка сохранения';
        statusMsg.style.color = '#ef4444';
      } else {
        for (var k in window.currentState) {
          window.initialState[k] = window.currentState[k];
        }
        filterOnlyModified = false;
        statusMsg.textContent = 'Настройки применены!';
        statusMsg.style.color = '#4ade80';
      }
      renderTabs();
      renderSidebar();
      renderContent(true);
      updateFooterState();
      statusMsg.className = 'status-msg show';
      setTimeout(function () { statusMsg.className = 'status-msg'; }, 2400);
    });
  };

  var legacyEl = document.getElementById('chkLegacy');
  var legacyBoxEl = document.getElementById('legacyBox');
  legacyEl.onclick = function () {
    var t = THEMES[currentThemeId] || THEMES.amber;
    var on = legacyEl.className.indexOf(' on') < 0;
    legacyEl.className = 'legacy-label' + (on ? ' on' : '');
    if (legacyBoxEl) {
      legacyBoxEl.style.backgroundColor = on ? t.primary : '#0d1117';
      legacyBoxEl.style.borderColor = on ? t.primary : '#485263';
    }
    if (on) send('/api/use_legacy', { permanent: true });
  };

  document.getElementById('btnClose').onclick = function () {
    send('/api/close', {});
  };

  // Чёткое позиционирование окна в целых пикселях БЕЗ размывающего transform:scale()
  function fitPanel() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 1280;
    var vh = window.innerHeight || document.documentElement.clientHeight || 800;

    var w = Math.min(1380, Math.max(1040, Math.round(vw * 0.84)));
    var h = Math.min(860, Math.max(640, Math.round(vh * 0.85)));
    w = w - (w % 2);
    h = h - (h % 2);

    panelW = w;
    panelH = h;
    var midH = h - 68 - 62;
    var sideW = 268;
    var contW = w - sideW;
    viewportH = midH - 36;
    trackH = midH - 20;

    var x = Math.max(0, Math.round((vw - w) / 2));
    var y = Math.max(0, Math.round((vh - h) / 2));

    modalEl.style.left = x + 'px';
    modalEl.style.top = y + 'px';
    modalEl.style.width = w + 'px';
    modalEl.style.height = h + 'px';
    modalEl.style.webkitTransform = 'none';
    modalEl.style.transform = 'none';

    topbarEl.style.width = w + 'px';
    footerEl.style.width = w + 'px';
    sidebarEl.style.height = midH + 'px';
    contentEl.style.left = sideW + 'px';
    contentEl.style.width = contW + 'px';
    contentEl.style.height = midH + 'px';
    scrollTrackEl.style.height = trackH + 'px';

    updateContentScrollUI();
  }

  window.addEventListener('resize', fitPanel);
  applyThemeCss(currentThemeId, currentFontScale);
  fitPanel();
  setTimeout(fitPanel, 200);

  renderTabs();
  renderSidebar();
  renderContent(true);
  updateFooterState();
</script>

<script>
  // Встроенный резервный мост связи с Python (гарантирует работу синхронизации, даже если внешний bridge.js повреждён в res_mods)
  (function () {
    if (window.__bridgeLoaded && typeof window.postJSON === 'function') {
      return;
    }
    window.__bridgeLoaded = true;
    var diag = window.__bridgeDiag = { model: false, apiRequest: false, viewEnv: false, helloSent: false, stateLen: 0, acks: 0, error: '' };
    var lastAck = '', lastState = '', started = false, dataCallbackRegistered = false;

    function safeJsonParse(v, fb) { try { return JSON.parse(v); } catch (e) { return fb; } }

    function applyStateJson(raw) {
      var uiReady = typeof window.renderContent === 'function';
      if (!raw || (raw === lastState && uiReady && window.__stateAppliedOnce)) return;
      var injected = safeJsonParse(raw, null);
      if (!injected || typeof injected !== 'object') return;
      lastState = raw;
      diag.stateLen = raw.length;
      var initial = {}, current = {}, src = injected.settings || {};
      for (var k in src) { if (src.hasOwnProperty(k)) { initial[k] = src[k]; current[k] = src[k]; } }
      window.initialState = initial;
      window.currentState = current;
      if (injected.resolutions && injected.resolutions.length) {
        window.availableResolutions = injected.resolutions.slice();
      }
      if (injected.supported && injected.supported.length) {
        var sm = {};
        for (var i = 0; i < injected.supported.length; i++) sm[injected.supported[i]] = true;
        window.supported = sm;
      } else {
        window.supported = null;
      }
      if (uiReady) {
        window.__stateAppliedOnce = true;
        try {
          if (typeof window.applyThemeFromState === 'function') window.applyThemeFromState();
          if (typeof window.renderTabs === 'function') window.renderTabs();
          if (typeof window.renderSidebar === 'function') window.renderSidebar();
          if (typeof window.renderContent === 'function') window.renderContent(true);
          if (typeof window.updateFooterState === 'function') window.updateFooterState();
        } catch (e) {}
      }
    }

    function processAck(raw) {
      if (!raw || raw === lastAck) return;
      lastAck = raw;
      var ack = safeJsonParse(raw, null);
      if (!ack || !ack.id) return;
      diag.acks++;
      try {
        if (ack.bindTarget && typeof window.__onPythonKeyCaptured === 'function') {
          window.__onPythonKeyCaptured(String(ack.bindTarget), String(ack.capturedKey || ''));
        }
      } catch (e) {}
      try {
        if (typeof window.__ack === 'function') window.__ack(String(ack.id), !!ack.ok);
      } catch (e) {}
    }

    function dispatchToPython(id, cmd, dataObj) {
      var jsonStr = '{}';
      try { jsonStr = JSON.stringify(dataObj || {}); } catch (e) {}
      var sEnv = false, sCmd = false;
      if (typeof window.viewEnv !== 'undefined' && typeof window.viewEnv.handleViewEvent === 'function') {
        try {
          window.viewEnv.handleViewEvent({
            __Type: 'GFViewEventProxy', type: 1, contentID: 1, decoratorID: 0, targetID: 0, isMouseEvent: false, on: true,
            arguments: [
              { __Type: 'GFValueProxy', name: 'id', string: String(id) },
              { __Type: 'GFValueProxy', name: 'cmd', string: String(cmd) },
              { __Type: 'GFValueProxy', name: 'json', string: String(jsonStr) }
            ]
          });
          sEnv = true;
        } catch (e) {}
      }
      if (window.model && typeof window.model.apiRequest === 'function') {
        try { window.model.apiRequest({ id: String(id), cmd: String(cmd), json: String(jsonStr) }); sCmd = true; } catch (e) {}
      }
      return sEnv || sCmd;
    }

    window.postJSON = function (url, data, cb) {
      var cmd = String(url || '').replace('/api/', '');
      var sid = window.__sid || (Math.random().toString(36).slice(2, 8));
      var num = Number(window.__n || 0) + 1;
      var id = sid + '-' + num;
      window.__sid = sid; window.__n = num;
      if (cb) { window.__cbs = window.__cbs || {}; window.__cbs[id] = cb; }
      var ok = dispatchToPython(id, cmd, data || {});
      if (!ok && window.__cbs && window.__cbs[id]) { var f = window.__cbs[id]; delete window.__cbs[id]; try { f(false); } catch (e) {} }
    };

    function registerDataCallback() {
      if (dataCallbackRegistered) return;
      if (typeof window.viewEnv !== 'undefined' && typeof window.viewEnv.addDataChangedCallback === 'function') {
        try { window.viewEnv.addDataChangedCallback('model', 0, true); dataCallbackRegistered = true; diag.viewEnv = true; } catch (e) {}
      }
    }

    function poll() {
      if (!window.model) return;
      registerDataCallback();
      applyStateJson(window.model.stateJson || '');
      processAck(window.model.ackJson || '');
    }

    function start() {
      if (started || !window.model) return started;
      started = true; diag.model = true;
      registerDataCallback();
      try { poll(); } catch (e) {}
      if (window.engine && typeof window.engine.on === 'function') {
        try { window.engine.on('viewEnv.onDataChanged', function () { try { poll(); } catch (e) {} }); } catch (e) {}
      }
      var helloId = 'bridge-hello-' + Math.random().toString(36).slice(2, 8);
      if (dispatchToPython(helloId, 'hello', {})) diag.helloSent = true;
      return true;
    }

    if (window.engine && window.engine.whenReady && typeof window.engine.whenReady.then === 'function') {
      window.engine.whenReady.then(function () { registerDataCallback(); start(); });
    }
    (function tick() { try { if (start()) poll(); } catch (e) {} setTimeout(tick, started ? 200 : 300); }());
  }());
</script>
